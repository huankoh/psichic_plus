[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psichic-workflows"
version = "0.1.0"
description = "Durable local PSICHIC+ ranking with optional isolated Boltz"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "psutil>=5.9,<8"]

[project.scripts]
psichic = "applications.scoring.__main__:main"

[tool.setuptools]
packages = ["applications", "applications.scoring", "applications.scorer", "applications.scorer.psichic_plus", "applications.scorer.boltz2", "psichic_plus_screening"]

[tool.setuptools.package-dir]
applications = "."
"applications.scoring" = "scoring"
"applications.scorer" = "scorer"
"applications.scorer.psichic_plus" = "scorer/psichic_plus"
"applications.scorer.boltz2" = "scorer/boltz2"
psichic_plus_screening = "../psichic_plus_screening"
