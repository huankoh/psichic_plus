[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psichic-adaptiveflow"
version = "0.1.0"
description = "Native AdaptiveFlow-VS worker adapter for PSICHIC+"
license = {file = "LICENSE"}
requires-python = ">=3.10"

[tool.setuptools]
packages = ["psichic_adaptiveflow", "psichic_adaptiveflow._screening"]

[tool.setuptools.package-dir]
psichic_adaptiveflow = "psichic_adaptiveflow"
"psichic_adaptiveflow._screening" = "../../psichic_plus_screening"

[tool.setuptools.package-data]
psichic_adaptiveflow = ["native.patch", "COPYING"]
